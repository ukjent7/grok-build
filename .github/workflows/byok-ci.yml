name: BYOK CI

# Minimal CI for the BYOK changes: compile + targeted tests.
# No local Rust needed; everything runs here on push/PR.
#
# Single job on purpose: the four steps share one target dir, so shared
# dependencies (tokio/reqwest/...) are compiled once instead of once per job.
# Splitting into parallel jobs was measured slower (cold cache every run:
# Cargo.lock churns on each monorepo sync and the 10 GB cache quota thrashes).
on:
  push:
    # NOTE: do NOT add tags/tags-ignore here. A tag filter narrows the whole
    # push trigger to tag pushes only and branch pushes stop triggering at
    # all. Tag pushes are skipped instead via the job-level `if` below: the
    # run still appears (as skipped, seconds) instead of vanishing silently.
    # Pure metadata/data files: nothing cargo compiles or tests reads them
    # (verified: no include_str!/build-script references). A push touching ONLY
    # these skips CI; mixed pushes still run it. install.ps1 is NOT in this list
    # even though cargo never reads it: the "Parse install.ps1" step below exists
    # solely to validate it, and ignoring it let installer-only pushes bypass their
    # own gate.
    # NOTE: crates/**.md is deliberately NOT here — prompt templates and
    # user-guide pages are compiled into binaries/tests via include_str!.
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES'
      - 'SOURCE_REV'
      - 'checksums/**'
      - 'scripts/byok.sh'
      - '.github/workflows/byok-build.yml'
      - '.github/workflows/byok-purge-jsdelivr.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES'
      - 'SOURCE_REV'
      - 'checksums/**'
      - 'scripts/byok.sh'
      - '.github/workflows/byok-build.yml'
      - '.github/workflows/byok-purge-jsdelivr.yml'
  workflow_dispatch:
    inputs:
      # A dispatch carries no "before" commit, so this is the only way to run
      # the added-copy scan below on demand (e.g. point it at the last sync).
      diff_base:
        description: 'Scan for i18n-unwrapped copy added since this rev (blank = skip)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Newer than rust-toolchain.toml on purpose (see that file's bump policy);
  # overrides it without touching the repo file.
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  verify:
    name: check + targeted tests
    # Tags carry no new code (process: tag only tested main commits, and the
    # release build still compiles everything). Skip the suite fast; the run
    # stays visible as skipped instead of burning a full build+test cycle.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history on purpose: the added-copy scan below diffs against the
      # commit the branch pointed at before the push, and checkout's default
      # depth-1 clone does not contain it. The pack is ~52 MB, i.e. seconds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fast non-Rust validation gates: fail in seconds if installer syntax or
      # localization wraps drifted, before downloading toolchains or running cargo check.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$errs)
          if ($errs.Count -ne 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Check i18n wraps
        run: python3 scripts/i18n/wrap-check.py check

      - name: Check i18n catalog reachability
        run: python3 scripts/i18n/catalog-check.py

      # xai-grok-tools-api runs proto codegen in its build script;
      # prefer a PATH protoc over the DotSlash-bundled one.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          # Unauthenticated api.github.com calls share 60 req/h per runner IP;
          # the repo token raises it.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          # The action installs the components you list and no others: a
          # `toolchain:` input does not merge in the `components` of
          # rust-toolchain.toml (that file asks for rustfmt too, and this step
          # still produced a toolchain without it -- CI's first run of the gate
          # below died on "'cargo-fmt' is not installed"). RUSTUP_TOOLCHAIN above
          # points the job at this toolchain, so this is the one that needs rustfmt.
          components: rustfmt

      # Formatting gates before compilation: it is the only check here that costs
      # nothing, and an unformatted tree hides the real diff for the rest of the run.
      # Deliberately pinned-free -- `cargo fmt` resolves whatever this job actually
      # runs (rust-toolchain.toml says 1.94.0, the step above installs 1.98.1), and
      # both were verified to agree on this tree, so the gate cannot flap between them.
      - name: Check formatting
        run: cargo fmt --all --check

      # Full target-dir cache (debug only). sccache was removed here on
      # purpose: CI(debug) and Build(release x N OSes) use disjoint hash
      # spaces but share one 10 GB pool, so concurrent writers evicted each
      # other and every job stayed half-cold. CI runs alone most of the time
      # and stays warm by recency; release compilation belongs to sccache.
      - uses: Swatinem/rust-cache@v2
        with:
          # FORK(byok): mint full-target entries on main only. PRs/tags/
          # dispatches restore without saving, so pushes stop adding GB
          # entries per Cargo.lock churn.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --all-targets also compiles the test/bench targets we edited.
      # Debug profile on purpose: the shell build script skips the
      # ripgrep download outside release builds.
      # --locked: the fork adds workspace members (xai-grok-locale) and the lock
      # file is committed, so a stale one has to fail here rather than be
      # silently rewritten on a runner (the tree must be reproducible).
      # FORK(byok): xai-grok-update is the fork's self-update channel
      # (byok.rs/auto_update.rs) — covered here, not just sampler/shell.
      # xai-grok-pager carries the fork's /usage hit-rate panel;
      # xai-proto-build carries the fork's Windows NUL fix.
      # FORK(i18n): xai-grok-locale is the fork's catalog crate; without it here
      # its own unit tests never even compile (`--all-targets` is per selected
      # package), which is how a blank-value/assertion conflict survived.
      # FORK(i18n): xai-grok-pager-minimal depends on pager, not vice versa,
      # so the pager entry never compiles it; its auth/panel/live wraps are
      # fork-owned. xai-grok-pager-render's own test targets likewise need an
      # explicit entry (ImageOverlayLabels/omitted_lines). xai-grok-pager-bin
      # is otherwise only compiled by the release build (init_locale_from_config).
      # xai-grok-shared (UiConfig.locale) and xai-grok-shell-base (endpoint_trust
      # delegates) are tiny; explicit entries compile their test targets too.
      # --keep-going: report errors across all crates/targets in one run
      # instead of stopping at the first failing unit (one CI cycle per
      # error otherwise). rustc may still hide cascade errors behind the
      # first one in the same function — that part is unavoidable.
      - name: Check (incl. test targets)
        run: cargo check --locked -p xai-grok-sampler -p xai-grok-shell -p xai-grok-sampling-types -p xai-grok-update -p xai-grok-pager -p xai-grok-pager-minimal -p xai-grok-pager-render -p xai-grok-pager-bin -p xai-grok-locale -p xai-grok-shared -p xai-grok-shell-base -p xai-proto-build --all-targets --keep-going

      # FORK(i18n): the mirror image of the step above. That one proves the
      # wraps we already had survived; this one looks at the copy this push
      # *added* and reports any that landed unlocalized -- the same silent
      # English fallback, just from the other direction (a new upstream string,
      # not a lost wrap). Base is wherever the branch pointed before the push,
      # so a sync arrives as one reviewable list instead of a wall of strings
      # that were already there.
      #
      # Advisory on purpose: "is this literal screen copy" is a heuristic, and
      # a gate that cries wolf gets switched off. Add `--fail-on-diff` once a
      # few syncs have come through with an empty list -- and move this step up
      # next to checkout at the same time, so a failure costs seconds instead
      # of a full build.
      - name: Scan for unwrapped copy added by this push
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha || inputs.diff_base }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision for this event (new branch or dispatch); scan skipped"
            exit 0
          fi
          python3 scripts/i18n/wrap-check.py diff --diff-base "$BEFORE"

      # FORK(i18n): catalog resolution, the blank-value invariant, the
      # intentional-blank plural sentinel, and locale precedence.
      - name: Test locale catalogs
        run: cargo test --locked -p xai-grok-locale --no-fail-fast

      - name: Test sampler
        run: cargo test --locked -p xai-grok-sampler --no-fail-fast

      # FORK(byok): unit tests for the fork update axis (tag/release
      # parsing, latest picking, installer gating). Cheap: deps already built.
      - name: Test update channel
        run: cargo test --locked -p xai-grok-update --no-fail-fast

      # FORK(byok/i18n): /usage hit-rate panel, version-mismatch banner, and reconnect guard.
      - name: Test pager fork features (usage + mismatch guard)
        run: cargo test --locked -p xai-grok-pager --no-fail-fast -- app::status_blocks version_mismatch reconnect_guard

      # FORK(i18n): minimal render mode is a separate crate the check step
      # compiles; its suite is small so run it whole.
      - name: Test minimal render mode
        run: cargo test --locked -p xai-grok-pager-minimal --no-fail-fast

      # Scoped on purpose: the full render suite is upstream's; we only own
      # the image-overlay labels and the preview omitted-lines template.
      - name: Test render overlays
        run: cargo test --locked -p xai-grok-pager-render --no-fail-fast -- image_overlay preview_overlay

      # FORK(byok): small build-tool crate; whole suite is cheap.
      - name: Test proto build
        run: cargo test --locked -p xai-proto-build --no-fail-fast

      # Scoped on purpose: the full sampling-types suite is upstream's
      # responsibility; we only own the endpoint_trust module.
      - name: Test endpoint trust predicate
        run: cargo test --locked -p xai-grok-sampling-types --no-fail-fast -- endpoint_trust

      # Substring filters: agent::config covers config.rs, config_tests and
      # config_model_override_parse; model_providers covers the provider layer.
      # model_overrides covers config::tests (ModelOverrideConfig::resolve,
      # including the fork's session_summary-is-unset cases) — `agent::config`
      # does not match that module.
      # Filters go after `--` (cargo itself takes a single TESTNAME positional).
      # NOTE: this still compiles the whole shell test target; only execution
      # is filtered. That compile is the long pole of this workflow.
      - name: Test shell config layers
        run: cargo test --locked -p xai-grok-shell --no-fail-fast -- agent::config agent::model_providers model_overrides
