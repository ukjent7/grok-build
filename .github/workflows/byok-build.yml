name: BYOK Build

# Cloud build for machines without local Rust: compiles the release binary
# and uploads it as a downloadable artifact.
#
# - Actions tab -> "BYOK Build" -> "Run workflow": builds main, download
#   the binary from the run's Artifacts section (rename to `grok`, chmod +x).
# - Push a tag like `byok-v0.1.0`: same build, plus attaches the binaries
#   to a published GitHub Release.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (macOS is 2x slower; tags always build windows+macOS)"
        type: choice
        options: [windows, windows-macos]
        default: windows
  push:
    tags:
      - "byok-v*"

# FORK(byok): least privilege by default; the release job below overrides this
# with `contents: write` (job-level permissions replace the workflow default).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Newer than rust-toolchain.toml on purpose (see that file's bump policy);
  # overrides it without touching the repo file.
  RUSTUP_TOOLCHAIN: 1.98.1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # FORK(byok): cap sccache well below its 10G default. The free plan shares
  # one 10G pool across CI target-dir archives, the registry cache, and the
  # win+mac sccache entries; uncapped, the fresh working set alone exceeds
  # the quota, LRU evicts what the next build needs, and every build stays
  # cold (observed: ~0% hits). 3G holds the dependency closure (~1350 locked
  # crates, the stable high-value part); workspace crates recompile on change
  # anyway. Tune from the per-build `sccache --show-stats` output below.
  SCCACHE_CACHE_SIZE: "3G"
  # The sccache server occasionally dies mid-build on huge crates
  # (observed: connection reset while compiling xai-grok-shell lib).
  # Fall back to local compilation instead of failing the whole build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Prevent sccache daemon from timing out during long compilation/linking stages
  SCCACHE_IDLE_TIMEOUT: "0"
  CARGO_INCREMENTAL: 0
  # FORK(byok): tag name baked into the binary as the update identity
  # (xai-grok-update/src/byok.rs). Only tag refs set it — the expression
  # yields '' for branch/dispatch runs, which behave as source builds (no
  # auto-update). The "Validate release tag" step guards tag-format runs.
  BYOK_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  # Single source of steps for both build jobs below (YAML anchor).
  # Per-platform names travel via ARTIFACT/BIN env so the macOS job reuses
  # them without a matrix of its own. Linux is intentionally not built.
  build:
    name: build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ARTIFACT: xai-grok-pager-windows-x64
      BIN: xai-grok-pager.exe
      # FORK(byok): cap cargo parallelism on Windows only. The sccache
      # server keeps dying under peak RAM on windows-latest (giant crates
      # x codegen-units=16); fewer concurrent rustc processes lower the
      # peak. macOS is healthy and stays uncapped.
      CARGO_BUILD_JOBS: "2"
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # FORK(byok): BYOK_RELEASE becomes the binary's update identity. The push
      # trigger only fires on `byok-v*` tags, but workflow_dispatch accepts any
      # ref, so a dispatch from e.g. a `v1.2` tag must not bake a bogus release
      # name. Branch dispatches carry '' and skip this gate (source build).
      - name: Validate release tag
        shell: bash
        run: |
          if [ -n "$BYOK_RELEASE" ] && ! printf '%s' "$BYOK_RELEASE" | grep -Eq '^byok-v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::BYOK_RELEASE '$BYOK_RELEASE' is not a byok-vX.Y.Z tag; refusing to bake it as the release identity. Dispatch from a byok-v* tag (branch runs build without auto-update)."
            exit 1
          fi

      # Proto codegen is mandatory in CI (see xai-proto-build find_protoc).
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3 (v3 branch / v3.0.0 tag)
        with:
          version: "28.x"
          # Unauthenticated api.github.com calls share 60 req/h per runner IP
          # and Windows runners burn through it; the repo token raises it.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-18)
        with:
          toolchain: 1.98.1

      # Content-addressed compile cache shared across branches/commits/jobs.
      # Only wraps rustc (C builds pass through untouched).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Registry-only: the multi-GB target dir is sccache's job now.
      # Caching it too kept the 10 GB quota permanently thrashed (writes
      # failing, restores always missing) for zero benefit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
          # FORK(byok): one registry entry shared by win+mac (registry is
          # platform-independent), minted on main only; tags/PRs restore.
          shared-key: byok-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Windows Defender scans every file cargo writes; excluding the workspace
      # and cargo home is worth 20-40% on Windows builders. Needs admin, which
      # GitHub-hosted runners have.
      - name: Exclude build paths from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        # Best-effort compile speedup only: 0x800106ba means the Defender
        # service is not running on this runner image, in which case the
        # exclusion is a no-op. Never fail the release build over it.
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath '${{ github.workspace }}'
          if ($env:CARGO_HOME) { Add-MpPreference -ExclusionPath $env:CARGO_HOME }

      # ci-release profile on purpose (see Cargo.toml): same codegen as
      # release, without the incremental bloat. The shell build script only
      # bundles ripgrep (network download) for release-like builds, and
      # ci-release inherits release so that still triggers.
      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --profile ci-release

      # Always print: when the cache backend is offline the build silently
      # falls back to local compile (SCCACHE_IGNORE_SERVER_IO_ERROR) and just
      # gets slow — this is how you tell that happened from the log.
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      # Rename to the platform-unique artifact name first: linux and macOS
      # binaries are both called xai-grok-pager and would collide as
      # release assets. The installer downloads these exact names.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/ci-release/${{ env.BIN }}" "dist/${{ env.ARTIFACT }}"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 14

  # macOS is 2x slower: tags always build it, manual runs only on request.
  build-macos:
    name: build (macos-latest)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'windows-macos' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      ARTIFACT: xai-grok-pager-macos-arm64
      BIN: xai-grok-pager
    steps: *build-steps

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/byok-v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # gh release create resolves the repo from git remotes; without this
      # it fails with "not a git repository".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
      - name: Generate SHA256 checksums
        # FORK(byok): install.ps1 verifies the binary against these files.
        # Raw sha256sum output verifies with `sha256sum -c`; the per-file
        # `.sha256` holds the bare hash and the PowerShell parser takes the
        # first whitespace-separated token of either format.
        run: |
          files=$(find dist -type f -name 'xai-grok-pager-*' ! -name '*.sha256')
          echo "$files"
          # Flat basenames: each artifact lands in its own subdir under dist/,
          # but release downloads are flat — emit `hash  <basename>` so
          # `sha256sum -c SHA256SUMS` works in the download folder.
          for f in $files; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > dist/SHA256SUMS
          cat dist/SHA256SUMS
          for f in $files; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          find dist -name '*.sha256' -o -name 'SHA256SUMS' | sort
      - name: Publish release
        run: |
          files=$(find dist -type f)
          echo "$files"
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" $files \
            --title "${{ github.ref_name }}" \
            --notes "BYOK build of grok (${{ github.sha }}). Artifact names carry the platform; rename the binary to \`grok\` to run it. Each binary ships a matching \`.sha256\` file (plus a combined \`SHA256SUMS\`); install.ps1 verifies the hash before installing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # FORK(byok): mirror the checksums into the repo tree so install.ps1
      # can fetch them over jsDelivr where direct GitHub is unreachable.
      # Runs after publishing, so a commit failure never blocks the release
      # itself (the installer still falls back to the release-asset copies).
      - name: Commit checksums to repo tree
        run: |
          TAG="${{ github.ref_name }}"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "checksums/$TAG"
          for f in $(find dist -type f -name 'xai-grok-pager-*' ! -name '*.sha256'); do
            cp "$f.sha256" "checksums/$TAG/$(basename "$f").sha256"
          done
          cp dist/SHA256SUMS "checksums/$TAG/SHA256SUMS"
          # Advance the `latest` pointer only when the new tag is newer, so a
          # backfilled older tag cannot move it backwards.
          # FORK(byok): prereleases never advance the pointer — GNU sort -V
          # ranks `0.2.0-rc1` above `0.2.0`, so an rc tag would wedge the
          # pointer past the eventual stable release. install.ps1 and the
          # Rust updater skip prereleases for the same reason.
          strip() { echo "$1" | sed 's/^byok-v//'; }
          is_prerelease() { case "$1" in *-*) return 0 ;; *) return 1 ;; esac; }
          cur=""
          if [ -f checksums/latest ]; then cur=$(tr -d ' \r\n' < checksums/latest); fi
          if is_prerelease "$(strip "$TAG")"; then
            echo "prerelease $TAG: checksums committed; latest pointer stays at ${cur:-none}"
          elif [ -z "$cur" ] || is_prerelease "$(strip "$cur")"; then
            # Empty pointer, or a legacy prerelease pointer a stable tag always replaces.
            printf '%s' "$TAG" > checksums/latest
          else
            top=$(printf '%s\n%s\n' "$(strip "$cur")" "$(strip "$TAG")" | sort -V | tail -n 1)
            if [ "$top" = "$(strip "$TAG")" ] && [ "$cur" != "$TAG" ]; then
              printf '%s' "$TAG" > checksums/latest
            fi
          fi
          git add "checksums/$TAG" checksums/latest
          if git diff --cached --quiet; then
            echo "checksums unchanged, skipping commit"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: checksums for $TAG"
            # Two tags released concurrently race on the `main` pointer.
            # Retry with rebase so the second push does not drop the pointer.
            pushed=0
            for i in 1 2 3; do
              if git push origin main; then pushed=1; break; fi
              echo "push rejected (attempt $i/3), rebasing..."
              git fetch origin main
              git rebase origin/main
            done
            # A `for` body does not propagate a failure, so without this the
            # step would report success with the pointer never pushed.
            if [ "$pushed" != 1 ]; then
              echo "::error::checksums not pushed after 3 attempts"
              exit 1
            fi
          fi

      # FORK(byok): the checksums commit above is pushed with GITHUB_TOKEN,
      # which never triggers other workflows — the purge workflow cannot
      # react to it. Purge the CDN-cached pointer right here. The purge API
      # is public (no token) and a failure only costs cache freshness until
      # TTL expiry, not the release itself.
      - name: Purge jsDelivr cache for checksums/latest
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/checksums/latest"
          # Same 6x10s read-back as byok-purge-jsdelivr.yml: a flaky purge
          # must not silently leave `@main/checksums/latest` stale at N-1.
          expected=$(tr -d ' \r\n' < checksums/latest)
          for i in 1 2 3 4 5 6; do
            actual=$(curl -fsSL "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/checksums/latest" | tr -d ' \r\n' || true)
            if [ "$actual" = "$expected" ]; then
              echo "CDN is fresh for checksums/latest."
              break
            fi
            echo "checksums/latest still stale (attempt $i/6), retrying..."
            sleep 10
          done
