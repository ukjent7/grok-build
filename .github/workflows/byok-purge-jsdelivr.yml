name: BYOK Purge jsDelivr

# jsDelivr caches mutable `@main` URLs, so the documented installer URL can
# keep serving a stale install.ps1 for hours after a push, and the
# `checksums/latest` pointer can lag a release for just as long. Immutable
# `@<tag>`/`@<sha>` URLs are unaffected and need no purge.
on:
  push:
    branches: [main]
    paths:
      - 'install.ps1'
      - 'checksums/latest'
  workflow_dispatch:

jobs:
  purge:
    name: purge install.ps1 and checksums/latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The purge targets are the @main CDN URLs, so verify against main
          # even for manual runs dispatched from another branch.
          ref: main

      - name: Purge jsDelivr cache
        run: |
          curl -fsSL --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/install.ps1"
          curl -fsSL --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/checksums/latest"

      - name: Verify CDN serves the pushed files
        run: |
          fail=0
          for f in install.ps1 checksums/latest; do
            expected=$(git show HEAD:$f | sha256sum | awk '{print $1}')
            ok=0
            for i in 1 2 3 4 5 6; do
              actual=$(curl -fsSL "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/$f" | sha256sum | awk '{print $1}')
              if [ "$actual" = "$expected" ]; then
                echo "CDN is fresh for $f."
                ok=1
                break
              fi
              echo "$f still stale (attempt $i/6), retrying..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "CDN still serves a stale $f after purge."
              fail=1
            fi
          done
          exit $fail
